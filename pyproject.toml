[project]
name = "spendloom"
version = "0.2.0"
description = "Spendloom: private, AI-assisted receipt capture and spending insights"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.64,<1",
  "argon2-cffi>=25,<26",
  "fastapi>=0.141,<0.142",
  "google-genai>=1.30,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "openai>=1.100,<4",
  "pillow>=11,<13",
  "pillow-heif>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipt_ledger"]
