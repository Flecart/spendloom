name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[test]'
      - run: APP_PASSWORD=correct-horse-battery-staple SESSION_SECRET=test-session-secret-that-is-long-enough AI_PROVIDER=none pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
  compose-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t spendloom:ci .
      - uses: returntocorp/semgrep-action@v1
        with: { config: p/default }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: spendloom:ci, severity: CRITICAL,HIGH, exit-code: '1' }
